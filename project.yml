name: OpenTalkType

options:
  bundleIdPrefix: ai.3mi
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  # The one third-party dependency. Silent, verified auto-update is not a thing to hand-roll:
  # the value is in the signature checking and the install-on-quit dance, and getting either
  # subtly wrong on an app that holds Accessibility permission is how you ship a backdoor.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5

targets:
  OpenTalkType:
    type: application
    platform: macOS
    sources:
      - path: OpenTalkType
        excludes:
          - Info.plist
          - OpenTalkType.entitlements
    dependencies:
      - sdk: libsqlite3.tbd
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: OpenTalkType
        PRODUCT_BUNDLE_IDENTIFIER: ai.3mi.opentalktype
        INFOPLIST_FILE: OpenTalkType/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: OpenTalkType/OpenTalkType.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # Off here and turned on only by the release workflow, which signs with a real
        # Developer ID. The hardened runtime enforces library validation: the app and the
        # embedded Sparkle.framework must carry the same Team ID. A local build is adhoc
        # and has no Team ID at all, so switching this on here makes every development
        # build die at launch with "mapping process and mapped file have different Team
        # IDs" -- which reads like a Sparkle bug and is not one.
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
