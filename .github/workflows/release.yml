name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build
        run: |
          xcodegen generate
          xcodebuild \
            -project OpenTalkType.xcodeproj \
            -scheme OpenTalkType \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The same suite CI runs, against the Release binary that is about to ship. A green Debug
      # build says nothing about what people download.
      - name: Self-test the release build
        run: build/Build/Products/Release/OpenTalkType.app/Contents/MacOS/OpenTalkType --selftest

      - name: Package
        run: |
          APP=build/Build/Products/Release/OpenTalkType.app
          # Ad-hoc signature: not a Developer ID, so Gatekeeper still quarantines a fresh
          # download, but it makes the bundle internally consistent. Sparkle's own EdDSA
          # signature below is what actually authenticates an update.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          mkdir -p dist
          # Sparkle updates from a zip; the dmg is for humans arriving from the releases page.
          ditto -c -k --keepParent "$APP" "dist/OpenTalkType-${{ steps.v.outputs.version }}.zip"

          mkdir -p stage
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "OpenTalkType" -srcfolder stage -ov -format ULFO \
            "dist/OpenTalkType-${{ steps.v.outputs.version }}.dmg"

          cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Sparkle tools
        run: |
          URL=$(gh api repos/sparkle-project/Sparkle/releases/latest \
                --jq '.assets[]|select(.name|endswith(".tar.xz"))|.browser_download_url' | head -1)
          mkdir -p sparkle && curl -sL "$URL" | tar xJ -C sparkle
          sparkle/bin/sign_update --version
        env:
          GH_TOKEN: ${{ github.token }}

      # The appcast is what every installed copy polls, and its EdDSA signature is the only thing
      # standing between a user and someone else's build. The private key never leaves Actions.
      - name: Sign and build the appcast
        run: |
          KEY=$(mktemp)
          printf '%s' "${{ secrets.SPARKLE_PRIVATE_KEY }}" > "$KEY"
          mkdir -p docs
          sparkle/bin/generate_appcast \
            --ed-key-file "$KEY" \
            --download-url-prefix "https://github.com/SammyLin/OpenTalkType/releases/download/${{ steps.v.outputs.tag }}/" \
            --link "https://github.com/SammyLin/OpenTalkType" \
            --maximum-versions 5 \
            -o docs/appcast.xml \
            dist
          rm -Pf "$KEY"
          cat docs/appcast.xml

      - name: Publish the appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git diff --cached --quiet || git commit -m "chore: appcast for ${{ steps.v.outputs.tag }}

          Published by the release workflow. Every installed copy polls this file, so it has to
          land before the release is announced."
          git push origin HEAD:main

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: OpenTalkType ${{ steps.v.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## Install

            Requires macOS 26 or later on Apple silicon.

            1. Open the .dmg and drag OpenTalkType to Applications.
            2. **This build is not notarised**, so macOS refuses to open it the first time.
               Right-click the app and choose Open, or run:

               ```
               xattr -d com.apple.quarantine /Applications/OpenTalkType.app
               ```

            3. Grant Accessibility and Microphone when asked. Accessibility is what the fn key and
               pasting depend on; without it nothing happens when you hold fn.
            4. System Settings, Keyboard: set "Press globe key to" to "Do Nothing", or holding fn
               opens the emoji picker on top of your dictation.

            After this first install, updates arrive in the app and install themselves.

            Why unsigned: notarising needs a paid Apple Developer account, which this project does
            not have yet. That affects the first install only. Updates are authenticated by
            Sparkle against a signing key that never leaves this repository's secrets, so an
            update cannot be substituted even by someone who controls the download server. Verify
            this first download yourself with `shasum -a 256` against SHA256SUMS.txt, or build
            from source in two commands, which the README covers.

            ## Verified before publishing

            Built in Release configuration on a macOS 26 runner, and the self-test suite was run
            against the exact binary inside this .dmg, not a debug build.
          generate_release_notes: true
